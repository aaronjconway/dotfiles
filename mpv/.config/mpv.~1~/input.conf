# cycle subtitles
s cycle sub

RIGHT seek 5 exact ; show-text "${time-pos} / ${duration}" 1000
LEFT  seek -5 exact ; show-text "${time-pos} / ${duration}" 1000
UP   add volume 5 
DOWN add volume -5 
q quit-watch-later

l seek 5 exact ; show-text "${time-pos} / ${duration}" 1000
h seek -5 exact ; show-text "${time-pos} / ${duration}" 1000
k   add volume 5 
j add volume -5 
