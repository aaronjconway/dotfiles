set -g history-limit 100000
set -g repeat-time 0
set -sg escape-time 50
set -g focus-events on
set -g mouse on
set -g mode-keys vi

set -g prefix C-t
bind C-t send-prefix

#not a fan of rotate window
unbind C-o 

bind l split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind k kill-pane

bind -T copy-mode-vi v send -X begin-selection 
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"


# Status bar (pure bg + fg)
set -g status-style "bg=#000000,fg=#ffffff"

# Left/right sections
set -g status-left-style "bg=#000000,fg=#ffffff"
set -g status-right-style "bg=#000000,fg=#ffffff"
set -g status-right ""

# Inactive windows (no grey; same as background)
setw -g window-status-style "bg=#000000,fg=#ffffff"

# Active/selected window (brighter via cyan accent)
setw -g window-status-current-style "bg=#000000,fg=#00d3d0,bold"

# Optional formatting
setw -g window-status-format " #W "
setw -g window-status-current-format " #W "
